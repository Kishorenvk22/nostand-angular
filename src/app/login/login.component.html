<div class="login-container">

    <h2 class="login-title">Login to Your Account</h2>
  
    <!-- Login form -->
    <form (ngSubmit)="onLogin()">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text"  [(ngModel)]="username" id="username" name="username" required />
      </div>
  
      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            id="password"
            name="password"
            required
          />
          <img [src]="showPassword ? 'images/view.png':'images/hide.png'" class="toggle-password" 
          (click)="togglePasswordVisibility()">
        </div>
      </div>

      <div *ngIf="loginError" class="alert alert-danger">
        {{loginError}}
      </div>
  
      <button type="submit" class="login-btn">Login</button>
    </form>
  
    <!-- Forgot password and sign-up links -->
    <div class="links">
      <a href="#" class="forgot-password">Forgot Password?</a>
      <p class="signup-link">
        Don't have an account? <a [routerLink]="['/dashboard/home/signUp']">Sign up</a>
      </p>
    </div>
  </div>
