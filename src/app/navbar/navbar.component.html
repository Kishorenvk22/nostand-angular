<div class="upper-navbar">
      <div class="menu-toggle" (click)="toggleSidebar()">
        <img style="height: 36px; " src="images/menu_icon.png">
      </div>

      <div class="brand" [routerLink]="['/dashboard/home']">FOOD</div>

      <div class="greeting-container" *ngIf="showgreeting">
        <div class="greeting-username">Hello, {{username}}</div>
      </div>
  
      <div class="menu-items">
          <i  (click)="toggleUsercard()" style="cursor: pointer;">
              <div class="loginSignUp-buttons">
                <button type="button" *ngIf="username === 'Guest User'" class="btn btn-outline-light mr-2" 
                (click)="toggleLogin()">Login</button>

                <button type="button" *ngIf="username === 'Guest User'" class="btn btn-outline-light"   
                [routerLink]="['/dashboard/home/signUp']"
                >Sign-up</button>

              </div>
          </i>

          <div class="cart-icon" (click)="toggleCart()">
            <button>
              <i class="fa fa-shopping-cart" >🛒</i>
            </button>
          </div>
          <span class="badge">{{ cartData.length }}</span>
    </div>
</div>

<!-- Login container -->
<div class="loginTogglecard" *ngIf="showLogin" (click)="closeLogin($event)">
  <div class="login-card" (click)="preventClose($event)">
    <button class="close-btn" (click)="closeLogin($event)">✖</button>

    <app-login></app-login>
  </div>
</div>

<div class="cart-backdrop" *ngIf="istogglecartOpen" (click)="toggleCart()" >
<div *ngIf="istogglecartOpen" class="cart-container" (click)="preventClose($event)">
  <div class="cart-header">
    <h2>Invoice</h2>
    <button (click)="toggleCart()">Close</button>
  </div>

  <div class="cart-items" >
    <div *ngFor="let item of cartData">
      <div class="cart-item" >            
        <span>{{ item.name }}</span>
        <span>₹{{ item.price }}</span>

        <div class="quantity-control">
          <button type="button" class="btn btn-secondary minusQuantity" (click)="decreaseQuantity(item)">-</button>
          <span>x {{ item.quantity }}</span>
          <button  type="button" class="btn btn-secondary" (click)="increaseQuantity(item)">+</button>
        </div>

        <span>₹{{ item.price * item.quantity }}</span>
      </div>
    </div>
  </div>

  <div class="cart-summary">
    <div class="summary-item">
      <span>Subtotal</span>
      <span>₹{{ subtotal }}</span>
    </div>
    <div class="summary-item">
      <span>GST (18%)</span>
      <span>₹{{ gst }}</span>
    </div>
    <div class="summary-item">
      <span>Total</span>
      <span>₹{{ total }}</span>
    </div>
  </div>

  <div class="cart-actions">
    <button (click)="proceedToPayment()">Proceed To Pay</button>
  </div>
</div>
</div>


<div *ngIf="sidebarOpen" class="navbar-backdrop" (click)="toggleSidebar()"></div>
<div class="side-navbar" [class.open]="sidebarOpen">
  <!-- Added close button with modern design -->
  <button
    type="button"
    class="btn-close btn-close-dark"
    aria-label="Close"
    (click)="toggleSidebar()"
  ></button>

  <!-- Added a sidebar header section -->
  <!-- <div class="sidebar-header">
    <h2>Menu</h2>
  </div> -->

  <ul class="sidebar-menu">
    <li (click)="preventClose($event)">
      <a
        class="menu-link"
        [routerLink]="['/dashboard/home']"
        (click)="toggleSidebar()"
      >
        <i class="fas fa-utensils"></i> Restaurants
      </a>
    </li>
    <li>
      <a class="menu-link">
        <i class="fas fa-comments"></i> Feedback
      </a>
    </li>
    <li>
      <a class="menu-link">
        <i class="fas fa-user"></i> My Profile
      </a>
    </li>
    <li>
      <a class="menu-link"  (click)="logout()">
        <i class="fas fa-sign-out-alt"></i> Logout
      </a>
    </li>
  </ul>
</div>
<div class="main-content">
    <router-outlet></router-outlet>
</div>
