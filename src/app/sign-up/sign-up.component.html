<div class="register-container" (click)="closeLogin($event)">
  <div class="register-card" (click)="$event.stopPropagation()">
    <button class="close-btn" (click)="closeModal()">✖</button>
    <h2>Register</h2>
    <form>
      <div *ngIf="!otpSent">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" [(ngModel)]="formData.name" name="name" required />
        </div>
        <div class="form-group">
          <label for="mobile">Mobile Number</label>
          <input type="tel" id="mobile" [(ngModel)]="formData.mobile" name="mobile" required />
        </div>
        <div class="form-group">
          <label for="email">Email ID</label>
          <input type="email" id="email" [(ngModel)]="formData.email" name="email" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" [(ngModel)]="formData.password" name="password" required />
        </div>
        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input
            type="password"
            id="confirm-password"
            [(ngModel)]="formData.confirmPassword"
            name="confirmPassword"
            required
          />
        </div>
        <button type="button" class="register-button" (click)="sendOtp()">Send OTP</button>
      </div>

     
    </form>
  </div>
</div>
